<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbour Kart - Credits</title><style>body{margin:0;background:#131b22;color:#ece8dd;font:18px/1.6 system-ui,sans-serif}main{max-width:760px;margin:5vh auto;padding:24px}a{color:#9edbd9}h1{line-height:1.2}pre{white-space:pre-wrap;font:inherit}</style></head><body><main><a href="./index.html">Back to Harbour Kart</a><h1>Asset credits</h1><pre id="credit">Loading attribution...</pre><p><a href="./assets/ATTRIBUTION.md">Original attribution document</a></p></main><script type="module">const el=document.getElementById('credit');try{const r=await fetch('./assets/ATTRIBUTION.md');if(!r.ok)throw new Error('Attribution unavailable');const text=await r.text();const parts=text.split(/(https?:\/\/[^\s)]+)/g);el.replaceChildren();for(const p of parts){if(/^https?:\/\//.test(p)){const a=document.createElement('a');a.href=p;a.textContent=p;el.append(a);}else el.append(document.createTextNode(p));}}catch(e){el.textContent='Please open the original attribution document below.';}</script></body></html>
